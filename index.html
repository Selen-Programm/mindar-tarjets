<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Tarjeta en realidad aumentada</title>
  <!-- Test de prueba con una tarjeta de presentación, limitante las direccionales -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
    a-scene { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    a-scene canvas { width: 100% !important; height: 100% !important; }
    .hint { position: fixed; z-index: 5; top: 1rem; left: 1rem; right: 1rem; padding: .8rem 1rem;
      color: white; background: #111b; border-radius: .75rem; text-align: center; pointer-events: none; }
    .arjs-loader { display: none; }
  </style>
</head>
<body>
  <div class="hint" id="status">Iniciando cámara…</div>

  <a-scene
    mindar-image="imageTargetSrc: ./assets/tarjets.mind; autoStart: false;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- targetIndex 0 = primera imagen que agregaste al compilador de MindAR. -->
    <a-entity id="cardTarget" mindar-image-target="targetIndex: 0">
      <!-- El objetivo ocupa aproximadamente 1 unidad de ancho. Ajusta según la relación de aspecto. -->
      <a-plane width="0.88" height="0.38" position="0 0.05 0.02"
        material="color: #102a43; opacity: 0.94; shader: flat">
      </a-plane>
      <a-text value="¡Hola!\nEsta tarjeta tiene una experiencia AR."
        color="#ffffff" align="center" width="1.8" position="0 0.05 0.03"></a-text>
      <a-text value="Edita este texto en index.html"
        color="#9fe7ff" align="center" width="1.4" position="0 -0.20 0.03"></a-text>
    </a-entity>
  </a-scene>
  <script>
    const status = document.getElementById('status');
    const scene = document.querySelector('a-scene');
    const target = document.getElementById('cardTarget');

    // Con autoStart desactivado, registramos todos los eventos antes de iniciar MindAR.
    scene.addEventListener('loaded', async () => {
      const arSystem = scene.systems['mindar-image-system'];
      scene.addEventListener('arReady', () => {
        status.textContent = 'Cámara lista: apunta al frente de la tarjeta';
      });
      scene.addEventListener('arError', () => {
        status.textContent = 'MindAR no pudo iniciar. Revisa cámara y permisos.';
      });
      target.addEventListener('targetFound', () => { status.textContent = '¡Tarjeta detectada!'; });
      target.addEventListener('targetLost', () => { status.textContent = 'Apunta la cámara al frente de la tarjeta'; });
      try {
        status.textContent = 'Iniciando cámara…';
        await arSystem.start();
      } catch (error) {
        console.error('No se pudo iniciar MindAR:', error);
        status.textContent = 'Error al iniciar: revisa la consola del navegador.';
      }
    }, { once: true });
  </script>
</body>
</html>
